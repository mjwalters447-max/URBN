name: U
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  u:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: U
        run: |
          curl -L 'https://sdmntpreastus.oaiusercontent.com/files/00000000-66ac-81f9-ae2b-b182b77d1ef5/raw?se=2026-09-16T07%3A23%3A34Z&sp=r&sv=2026-02-06&sr=b&scid=2ed365e0-e2b1-5ceb-9413-9134aac898a8&skoid=e96cf01c-9c0f-4e27-b41e-0f2e435e6532&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T23%3A02%3A11Z&ske=2026-09-16T23%3A02%3A11Z&sks=b&skv=2026-02-06&sig=lhIVjekak5t3OUYa5Mr11UIJ7O11liAJ3LwkIaC45MU%3D' -o /tmp/u.zip
          mkdir -p /tmp/u
          unzip -q /tmp/u.zip -d /tmp/u
          cp -f /tmp/u/* .
          rm -f .github/workflows/u.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'u'
