<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>URBN</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <section id="lock" class="lock-wrap">
      <div class="lock-card">
        <div class="mark">◈</div>
        <h1>URBN</h1>
        <p class="muted">Private view</p>
        <form id="unlock-form">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" required>
          <label class="remember"><input id="remember" type="checkbox"> Remember this device</label>
          <button type="submit">Unlock</button>
          <p id="unlock-error" class="error" aria-live="polite"></p>
        </form>
      </div>
    </section>

    <section id="app" class="hidden">
      <header>
        <div>
          <h1>◈ URBN</h1>
          <p id="freshness" class="muted"></p>
        </div>
        <button id="lock-button" class="ghost">Lock</button>
      </header>

      <section class="filter-panel" aria-label="Filters">
        <label class="filter-search">
          <span>Search</span>
          <input id="search" type="search" placeholder="Search…">
        </label>
        <label class="filter-control">
          <span>Source</span>
          <select id="source-filter"><option value="">All Sources</option></select>
        </label>
        <label class="filter-control">
          <span>Type</span>
          <select id="group-filter"><option value="">All Types</option></select>
        </label>
        <label class="filter-control">
          <span>Size</span>
          <select id="size-filter"><option value="">Any Size</option></select>
        </label>
        <label class="filter-control">
          <span id="attribute-caption">Attribute</span>
          <select id="attribute-filter"><option value="">Any</option></select>
        </label>
        <label class="filter-control sort-control">
          <span>Sort</span>
          <select id="sort">
            <option value="name">Sort</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="discount">Largest Discount</option>
            <option value="ppg">Unit Value: Low to High</option>
          </select>
        </label>
      </section>

      <nav>
        <button data-view="browse" class="active">All</button>
        <button data-view="offers">Offers Only</button>
        <button data-view="compare"><span>Cross<br>Matches</span></button>
        <button data-view="sources">Sources</button>
      </nav>

      <section id="summary" class="summary"></section>
      <section id="content" class="cards"></section>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
